services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - benshu-data:/data          # SQLite: карточки и журнал событий
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/benshu-app.inc:/etc/nginx/conf.d/benshu-app.inc:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}

volumes:
  benshu-data:
