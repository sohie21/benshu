# Режим http (NGINX_MODE=http): сайт по http + проверка домена для Let's Encrypt.
# ${DOMAIN} подставляется из .env при старте контейнера.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    include /etc/nginx/benshu-app.inc;
}
