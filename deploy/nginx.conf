# Шаблон: ${DOMAIN} подставляется из .env при старте контейнера nginx.
# Этап 1 (до сертификата) работает только блок на 80 порту.
# Этап 2: после получения сертификата раскомментируйте блок 443 и редирект.

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # --- Этап 2: раскомментируйте, когда появится сертификат ---
    # location / { return 301 https://$host$request_uri; }

    # --- Этап 1: сайт по http ---
    include /etc/nginx/conf.d/benshu-app.inc;
}

